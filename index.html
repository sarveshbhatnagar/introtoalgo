<head>
  <meta charset="UTF-8">

  </script>

  <!-- Shared styles (tokens, reset, navbar, cursor, footer…) -->

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-116936620-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <!-- Google AdSense -->
  <script data-ad-client="ca-pub-8611389211624701" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

  <style>
    /* ── Hero ──────────────────────────────────────────────────── */
    .hero {
      padding: 4.5rem 0 3.5rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.55s ease both;
    }
    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .hero-eyebrow::after {
      content: '';
      display: block;
      width: 48px;
      height: 1px;
      background: var(--accent-dim);
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 7vw, 4.8rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.035em;
      color: var(--text);
      margin-bottom: 1.4rem;
    }
    .hero-title .hl { color: var(--accent); }
    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-mid);
      max-width: 500px;
      line-height: 1.65;
      font-style: italic;
    }

    /* ── Section label ─────────────────────────────────────────── */
    .section-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 2.75rem 0 1.5rem;
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Featured post ─────────────────────────────────────────── */
    .featured {
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg-raised);
      transition: border-color 0.3s;
      animation: fadeUp 0.55s 0.08s ease both;
    }
    .featured:hover { border-color: var(--accent-dim); }
    .featured-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      filter: grayscale(25%) brightness(0.75) contrast(1.05);
      transition: filter 0.4s;
    }
    .featured:hover .featured-img { filter: grayscale(0%) brightness(0.85); }
    .featured-body { padding: 2rem 2.25rem 2.25rem; }

    .post-meta { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem; }
    .post-date {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .post-tag {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid rgba(200, 240, 71, 0.2);
      padding: 0.12rem 0.5rem;
      border-radius: 2px;
    }
    .featured-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    .featured-title a { transition: color 0.2s; }
    .featured-title a:hover { color: var(--accent); }
    .post-excerpt { font-size: 0.98rem; color: var(--text-mid); line-height: 1.65; margin-bottom: 1.4rem; }
    .read-btn {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: gap 0.2s;
    }
    .read-btn:hover { gap: 0.9rem; }
    .read-btn::after { content: '→'; }

    /* ── Post list ─────────────────────────────────────────────── */
    .post-list { list-style: none; }
    .post-item {
      display: grid;
      grid-template-columns: 2.8rem 1fr auto;
      gap: 1.25rem;
      padding: 1.75rem 0;
      border-top: 1px solid var(--border);
      align-items: start;
      animation: fadeUp 0.5s ease both;
    }
    .post-item:last-child { border-bottom: 1px solid var(--border); }
    .post-item:nth-child(1) { animation-delay: 0.12s; }
    .post-item:nth-child(2) { animation-delay: 0.17s; }
    .post-item:nth-child(3) { animation-delay: 0.22s; }
    .post-item:nth-child(4) { animation-delay: 0.27s; }
    .post-item:nth-child(5) { animation-delay: 0.32s; }
    .post-item:nth-child(6) { animation-delay: 0.37s; }
    .post-item:nth-child(7) { animation-delay: 0.42s; }
    .post-num {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--text-dim);
      padding-top: 0.35rem;
    }
    .post-item-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 0.35rem;
      transition: color 0.2s;
    }
    .post-item:hover .post-item-title { color: var(--accent); }
    .post-item-excerpt { font-size: 0.88rem; color: var(--text-mid); line-height: 1.55; }
    .post-thumb {
      width: 88px;
      height: 62px;
      object-fit: cover;
      border-radius: 2px;
      filter: grayscale(40%) brightness(0.7);
      transition: filter 0.3s;
      flex-shrink: 0;
    }
    .post-item:hover .post-thumb { filter: grayscale(0%) brightness(0.85); }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .post-item { grid-template-columns: 2.2rem 1fr; }
      .post-thumb { display: none; }
      .featured-img { height: 200px; }
      .featured-body { padding: 1.25rem 1.5rem 1.5rem; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- ── Hero ───────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-eyebrow">artificial intelligence &amp; large language models</div>
    <h1 class="hero-title">
      Learn to build with<br><span class="hl">AI.</span>
    </h1>
    <p class="hero-sub">Practical guides on prompting, RAG pipelines, LLM agents, and fine-tuning — from first principles to production.</p>
  </section>

  <!-- ── Featured post ──────────────────────────────────────── -->
  <div class="section-row">
    <span class="section-label">Featured</span>
    <div class="section-line"></div>
  </div>
  <article class="featured" id="featured-post"></article>

  <!-- ── Post list ──────────────────────────────────────────── -->
  <div class="section-row">
    <span class="section-label">All Posts</span>
    <div class="section-line"></div>
  </div>
  <ul class="post-list" id="post-list"></ul>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer class="site-footer">
    <span class="footer-text">&copy; introtoalgo</span>
    <span class="footer-text">By <a href="https://www.sarveshbhatnagar.com" target="_blank" rel="noopener">Sarvesh Bhatnagar</a></span>
  </footer>

</div><!-- /.wrap -->

<!-- Shared navbar (injects header + cursor into every page) -->
<script src="assets/js/navbar.js"></script>

<!-- Posts data — edit assets/js/posts.js to add new posts -->
<script src="assets/js/posts.js"></script>
<script>
(function() {
  function pad(n) { return String(n).padStart(2, '0'); }
  function metaHTML(post) {
    var tag = post.tag ? '<span class="post-tag">' + post.tag + '</span>' : '';
    return '<div class="post-meta"><span class="post-date">' + post.date + '</span>' + tag + '</div>';
  }

  var active = POSTS.filter(function(p) { return !p.archived; });
  var fp  = active.find(function(p) { return p.featured; }) || active[0];
  var fel = document.getElementById('featured-post');
  fel.innerHTML =
    (fp.image ? '<a href="' + fp.url + '"><img src="' + fp.image + '" alt="' + fp.title + '" class="featured-img"></a>' : '') +
    '<div class="featured-body">' +
      metaHTML(fp) +
      '<h2 class="featured-title"><a href="' + fp.url + '">' + fp.title + '</a></h2>' +
      '<p class="post-excerpt">' + fp.excerpt + '</p>' +
      '<a href="' + fp.url + '" class="read-btn">Read Article</a>' +
    '</div>';

  var others = active.filter(function(p) { return !p.featured; });
  var list   = document.getElementById('post-list');
  list.innerHTML = others.map(function(post, i) {
    var thumb = post.image
      ? '<a href="' + post.url + '"><img src="' + post.image + '" alt="' + post.title + '" class="post-thumb"></a>'
      : '';
    return '<li class="post-item">' +
      '<span class="post-num">' + pad(i + 1) + '</span>' +
      '<div>' +
        metaHTML(post) +
        '<a href="' + post.url + '"><h3 class="post-item-title">' + post.title + '</h3></a>' +
        '<p class="post-item-excerpt">' + post.excerpt + '</p>' +
      '</div>' +
      thumb +
    '</li>';
  }).join('');
})();
</script>

</body>
</html>
