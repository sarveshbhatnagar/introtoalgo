<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — introtoalgo</title>
  <meta name="description" content="Browse posts by category on introtoalgo.">
  <meta name="robots" content="noindex">

  <meta property="og:title" content="Category — introtoalgo">
  <meta property="og:description" content="Browse posts by category on introtoalgo.">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Category — introtoalgo">
  <meta name="twitter:description" content="Browse posts by category on introtoalgo.">
  <link rel="stylesheet" href="assets/css/blog.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-116936620-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-116936620-1');
  </script>
  <script data-ad-client="ca-pub-8611389211624701" async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

  <style>
    .page-header {
      padding: 3.5rem 0 2.5rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.5s ease both;
    }
    .page-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .page-eyebrow::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--accent-dim);
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 0.6rem;
    }
    .page-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .section-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 2.5rem 0 1.5rem;
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* Post list — same as index.html */
    .post-list { list-style: none; }
    .post-item {
      display: grid;
      grid-template-columns: 2.8rem 1fr auto;
      gap: 1.25rem;
      padding: 1.75rem 0;
      border-top: 1px solid var(--border);
      align-items: start;
      animation: fadeUp 0.5s ease both;
    }
    .post-item:last-child { border-bottom: 1px solid var(--border); }
    .post-item:nth-child(1) { animation-delay: 0.08s; }
    .post-item:nth-child(2) { animation-delay: 0.13s; }
    .post-item:nth-child(3) { animation-delay: 0.18s; }
    .post-item:nth-child(4) { animation-delay: 0.23s; }
    .post-item:nth-child(5) { animation-delay: 0.28s; }

    .post-num {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--text-dim);
      padding-top: 0.35rem;
    }
    .post-meta { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem; }
    .post-date {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .post-tag {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid rgba(200, 240, 71, 0.2);
      padding: 0.12rem 0.5rem;
      border-radius: 2px;
    }
    .post-item-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 0.35rem;
      transition: color 0.2s;
    }
    .post-item:hover .post-item-title { color: var(--accent); }
    .post-item-excerpt { font-size: 0.88rem; color: var(--text-mid); line-height: 1.55; }
    .post-thumb {
      width: 88px;
      height: 62px;
      object-fit: cover;
      border-radius: 2px;
      filter: grayscale(40%) brightness(0.7);
      transition: filter 0.3s;
      flex-shrink: 0;
    }
    .post-item:hover .post-thumb { filter: grayscale(0%) brightness(0.85); }

    /* Empty state */
    .empty-state {
      padding: 4rem 0;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .empty-state p {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .back-link {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 2.5rem;
      padding-bottom: 2.5rem;
      transition: color 0.2s, gap 0.2s;
    }
    .back-link::before { content: '←'; }
    .back-link:hover { color: var(--accent); gap: 0.8rem; }

    @media (max-width: 600px) {
      .post-item { grid-template-columns: 2.2rem 1fr; }
      .post-thumb { display: none; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header class="page-header">
    <div class="page-eyebrow" id="eyebrow">category</div>
    <h1 class="page-title" id="page-title">Loading…</h1>
    <p class="page-count" id="page-count"></p>
  </header>

  <div class="section-row">
    <span class="section-label">Posts</span>
    <div class="section-line"></div>
  </div>

  <ul class="post-list" id="post-list"></ul>

  <a href="algos.html" class="back-link">Back to Algos</a>

  <footer class="site-footer">
    <span class="footer-text">&copy; introtoalgo</span>
    <span class="footer-text">By <a href="https://www.sarveshbhatnagar.com" target="_blank" rel="noopener">Sarvesh Bhatnagar</a></span>
  </footer>

</div>

<script src="assets/js/posts.js"></script>
<script>
(function() {
  // Read tag from URL: category.html?tag=Graph+Theory
  var params = new URLSearchParams(window.location.search);
  var tag    = params.get('tag') || '';

  // Update page title
  document.title = (tag || 'Category') + ' — introtoalgo';
  document.getElementById('page-title').textContent = tag || 'All Posts';

  // Filter posts
  var active   = POSTS.filter(function(p) { return !p.archived; });
  var filtered = tag ? active.filter(function(p) { return p.tag === tag; }) : active;

  // Count
  var countEl = document.getElementById('page-count');
  countEl.textContent = filtered.length + (filtered.length === 1 ? ' post' : ' posts');

  function pad(n) { return String(n).padStart(2, '0'); }

  var list = document.getElementById('post-list');

  if (filtered.length === 0) {
    list.insertAdjacentHTML('afterend',
      '<div class="empty-state"><p>No posts in this category yet.</p></div>'
    );
  } else {
    list.innerHTML = filtered.map(function(post, i) {
      var thumb = post.image
        ? '<a href="' + post.url + '"><img src="' + post.image + '" alt="' + post.title + '" class="post-thumb"></a>'
        : '';
      var tagHtml = post.tag
        ? '<span class="post-tag">' + post.tag + '</span>'
        : '';
      return '<li class="post-item">' +
        '<span class="post-num">' + pad(i + 1) + '</span>' +
        '<div>' +
          '<div class="post-meta"><span class="post-date">' + post.date + '</span>' + tagHtml + '</div>' +
          '<a href="' + post.url + '"><h3 class="post-item-title">' + post.title + '</h3></a>' +
          '<p class="post-item-excerpt">' + post.excerpt + '</p>' +
        '</div>' +
        thumb +
      '</li>';
    }).join('');
  }

})();
</script>

<script src="assets/js/navbar.js"></script>

</body>
</html>
